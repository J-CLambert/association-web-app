services:
  # MySQL
  mysql-server:
    env_file:
      - ../event-api.env
    image: mysql:8.0
    volumes:
      - ./docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/
    ports:
      - "3308:3306"

  # event-api
  event-api:
    env_file:
      - ../event-api.env
    image: event-api:latest
    build: ../.
    ports:
      - "8080:8080"
    depends_on:
      - mysql-server