# add this on application-test.properties code
spring.datasource.url=jdbc:h2:mem:public;MODE=MYSQL;DATABASE_TO_LOWER=TRUE
spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect
# now I use H2 with a MySQL dialect. That must be changed by using Testcontainers in future for integration test
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true

spring.jpa.open-in-view=false