name: event-api CI/CD pipline
on:
  push:
    pull_requests:
      - main
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-lastest

    defaults:
      run:
        working-directory: ./event-api

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up java 25
      - name: Set up java 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: run Maven tests
        run: mvn clean test
